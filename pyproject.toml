[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-request-equity"
version = "0.1.0"
description = "Equity-focused analysis of municipal 311 service requests."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
